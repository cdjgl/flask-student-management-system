<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化 - 学生管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .visualization-header {
            background: white;
            padding: 12px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .visualization-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn {
            padding: 8px 16px;
            background: #4096ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dashboard {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .stat-icon.blue { background: #e6f2ff; color: #4096ff; }
        .stat-icon.green { background: #d1fae5; color: #10b981; }
        .stat-icon.orange { background: #fef3c7; color: #f59e0b; }
        .stat-icon.red { background: #fee2e2; color: #ef4444; }
        .stat-icon.purple { background: #ede9fe; color: #8b5cf6; }
        .stat-value { font-size: 24px; font-weight: 700; color: #1f2937; }
        .stat-label { font-size: 12px; color: #6b7280; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card.full-width {
            grid-column: span 3;
        }
        .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chart-container {
            height: 220px;
        }
        .summary-section {
            background: linear-gradient(135deg, #4096ff 0%, #69c0ff 100%);
            border-radius: 12px;
            padding: 24px;
            color: white;
            text-align: center;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .summary-value {
            font-size: 32px;
            font-weight: 700;
        }
        .summary-label {
            font-size: 12px;
            opacity: 0.9;
        }
        @media (max-width: 1200px) {
            .charts-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-card.full-width { grid-column: span 2; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .chart-card.full-width { grid-column: span 1; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="visualization-header">
        <h1><i class="bi bi-chart-bar"></i> 数据可视化分析</h1>
        <button class="back-btn" onclick="window.location.href='{{ url_for('dashboard') }}'">
            <i class="bi bi-arrow-left"></i> 返回首页
        </button>
    </div>

    <div class="dashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="bi bi-people"></i></div>
                <div>
                    <div class="stat-value" id="totalStudents">--</div>
                    <div class="stat-label">总学生数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-book-open"></i></div>
                <div>
                    <div class="stat-value" id="totalCourses">--</div>
                    <div class="stat-label">课程总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="bi bi-trophy"></i></div>
                <div>
                    <div class="stat-value" id="competitionWins">--</div>
                    <div class="stat-label">竞赛获奖数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red"><i class="bi bi-exclamation-triangle"></i></div>
                <div>
                    <div class="stat-value" id="warningCount">--</div>
                    <div class="stat-label">预警学生数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="bi bi-building"></i></div>
                <div>
                    <div class="stat-value" id="collegeCount">--</div>
                    <div class="stat-label">学院数量</div>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-gender-ambiguous"></i> 性别分布</h3>
                <div class="chart-container"><canvas id="genderChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-building"></i> 学院分布</h3>
                <div class="chart-container"><canvas id="collegeChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-mortarboard"></i> 班级分布</h3>
                <div class="chart-container"><canvas id="classChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-bar-chart"></i> 成绩分布</h3>
                <div class="chart-container"><canvas id="scoreChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-trending-up"></i> 课程平均分</h3>
                <div class="chart-container"><canvas id="courseChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-award"></i> 绩点分布</h3>
                <div class="chart-container"><canvas id="gpaChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-file-text"></i> 课程类型分布</h3>
                <div class="chart-container"><canvas id="courseTypeChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-calendar"></i> 学期分布</h3>
                <div class="chart-container"><canvas id="semesterChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title"><i class="bi bi-pie-chart"></i> 课程性质分布</h3>
                <div class="chart-container"><canvas id="courseNatureChart"></canvas></div>
            </div>
            <div class="chart-card full-width summary-section">
                <div class="summary-grid">
                    <div>
                        <div class="summary-value" id="passRate">--%</div>
                        <div class="summary-label">整体及格率</div>
                    </div>
                    <div>
                        <div class="summary-value" id="avgScore">--</div>
                        <div class="summary-label">平均成绩</div>
                    </div>
                    <div>
                        <div class="summary-value" id="avgGpa">--</div>
                        <div class="summary-label">平均绩点</div>
                    </div>
                    <div>
                        <div class="summary-value" id="highScoreRate">--%</div>
                        <div class="summary-label">高分率(≥90分)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script>
        window.onload = function() {
            fetch('{{ url_for("api_dashboard_stats") }}').then(r => r.json()).then(data => {
                document.getElementById('totalStudents').textContent = data.total_students;
                document.getElementById('totalCourses').textContent = data.total_courses;
                document.getElementById('competitionWins').textContent = data.total_competitions;
                document.getElementById('warningCount').textContent = data.warning_count;
                document.getElementById('collegeCount').textContent = data.college_count || 8;
            });

            fetch('{{ url_for("api_chart_gender") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('genderChart'), {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: ['#4096ff', '#ec4899'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: { position: 'bottom', labels: { padding: 12, font: { size: 11 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_college_distribution") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('collegeChart'), {
                    type: 'pie',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: ['#4096ff','#67c23a','#e6a23c','#f56c6c','#909399','#b37feb','#5b8ff9','#5ad8a6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { padding: 6, font: { size: 9 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_class_distribution") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('classChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels.slice(0, 6),
                        datasets: [{
                            data: data.data.slice(0, 6),
                            backgroundColor: '#4096ff',
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y',
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { beginAtZero: true, grid: { color: '#f3f4f6' }, ticks: { font: { size: 10 } } },
                            y: { grid: { display: false }, ticks: { font: { size: 10 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_score_distribution") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('scoreChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: ['#ef4444','#f59e0b','#10b981','#06b6d4','#6366f1'],
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false }, ticks: { font: { size: 11 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_course_averages") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('courseChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels.slice(0, 6),
                        datasets: [{
                            data: data.data.slice(0, 6),
                            backgroundColor: data.data.slice(0, 6).map(v => v >= 60 ? '#10b981' : '#ef4444'),
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, max: 100, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45 } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_gpa_distribution") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('gpaChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: '#8b5cf6',
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false }, ticks: { font: { size: 11 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_course_type") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('courseTypeChart'), {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: ['#4096ff','#67c23a','#e6a23c','#f56c6c'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%',
                        plugins: { legend: { position: 'bottom', labels: { padding: 10, font: { size: 10 } } } }
                    }
                });
            });

            fetch('{{ url_for("api_chart_semester") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('semesterChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: '#10b981',
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false }, ticks: { font: { size: 9 } } }
                        }
                    }
                });
            });

            fetch('{{ url_for("api_chart_course_nature") }}').then(r => r.json()).then(data => {
                new Chart(document.getElementById('courseNatureChart'), {
                    type: 'pie',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.data,
                            backgroundColor: ['#4096ff','#f59e0b','#10b981'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { padding: 10, font: { size: 11 } } } }
                    }
                });
            });

            fetch('{{ url_for("api_chart_summary") }}').then(r => r.json()).then(data => {
                document.getElementById('passRate').textContent = data.pass_rate + '%';
                document.getElementById('avgScore').textContent = data.avg_score;
                document.getElementById('avgGpa').textContent = data.avg_gpa;
                document.getElementById('highScoreRate').textContent = data.high_score_rate + '%';
            });
        };
    </script>
</body>
</html>
